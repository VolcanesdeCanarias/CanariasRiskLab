name: RiskLab P0 and NEXT regression

on:
  push:
    branches: [fix/p0-security-data-reliability, integration/next-phase1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    # Pin the supported OS; ubuntu-latest may advance beyond Playwright support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: node tests/frontend_data_status.test.cjs
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: node tests/browser/review.cjs
      - run: npm ci
      - run: node tests/next/view-state.test.mjs
      - run: node tests/next/browser.cjs
      - run: node tests/next/observatory.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review-fixtures
          path: work/browser-review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-browser-review-fixtures
          path: work/next-captures/
      - run: git diff --check
